<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EDF2" stop-opacity=".35"/>
      <stop offset="45%" stop-color="#FFD43B" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="future" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
      .title { font-family: Arial, sans-serif; font-weight: 700; fill:#E8EDF2; }
      .muted { fill:#8A949E; }
      .gold { fill:#FFD43B; }
      .red { fill:#E63946; }
      .small { font-size:10px; letter-spacing:2.4px; }
      .label { font-size:12px; letter-spacing:1.2px; font-weight:700; }
      .sub { font-size:10px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="430" rx="24" fill="#0B0D10"/>
  <rect x="18" y="18" width="964" height="394" rx="20" fill="#15191E" stroke="#303842"/>

  <!-- subtle grid -->
  <g opacity=".16" stroke="#8A949E" stroke-width="1">
    <path d="M48 92H952M48 145H952M48 198H952M48 251H952M48 304H952M48 357H952"/>
    <path d="M150 65V365M250 65V365M350 65V365M450 65V365M550 65V365M650 65V365M750 65V365M850 65V365"/>
  </g>

  <!-- header -->
  <text x="55" y="55" class="mono small muted">HNF // DEVELOPMENT EVOLUTION</text>
  <text x="945" y="55" text-anchor="end" class="mono small gold">EVOLVING</text>

  <text x="55" y="88" class="title" font-size="22">From interfaces to systems.</text>
  <text x="55" y="108" class="mono sub muted">NOT A STACK TO COLLECT — A PATH TO UNDERSTAND</text>

  <!-- main evolution track -->
  <path d="M70 235
           C135 180 185 180 245 235
           C305 290 355 290 415 235
           C475 180 525 180 585 235
           C645 290 695 290 755 235
           C815 180 865 180 925 235"
        fill="none" stroke="#080A0D" stroke-width="10" stroke-linecap="round"/>

  <path d="M70 235
           C135 180 185 180 245 235
           C305 290 355 290 415 235
           C475 180 525 180 585 235
           C645 290 695 290 755 235
           C815 180 865 180 925 235"
        fill="none" stroke="url(#track)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="9 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- moving signal -->
  <circle r="5" fill="#FFD43B" filter="url(#glowGold)">
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M70 235 C135 180 185 180 245 235 C305 290 355 290 415 235 C475 180 525 180 585 235 C645 290 695 290 755 235 C815 180 865 180 925 235"/>
  </circle>

  <!-- milestone 01 -->
  <g>
    <circle cx="70" cy="235" r="12" fill="#0B0D10" stroke="#FFD43B" stroke-width="2"/>
    <circle cx="70" cy="235" r="4" fill="#FFD43B"/>
    <text x="70" y="165" text-anchor="middle" class="mono gold label">01</text>
    <text x="70" y="185" text-anchor="middle" class="title" font-size="12">FRONTEND</text>
    <text x="70" y="202" text-anchor="middle" class="mono sub muted">HTML • CSS • JS</text>
  </g>

  <!-- milestone 02 -->
  <g>
    <circle cx="245" cy="235" r="12" fill="#0B0D10" stroke="#E63946" stroke-width="2"/>
    <circle cx="245" cy="235" r="4" fill="#E63946"/>
    <text x="245" y="285" text-anchor="middle" class="mono red label">02</text>
    <text x="245" y="305" text-anchor="middle" class="title" font-size="12">MODERN WEB</text>
    <text x="245" y="322" text-anchor="middle" class="mono sub muted">REACT</text>
  </g>

  <!-- milestone 03 -->
  <g>
    <circle cx="415" cy="235" r="12" fill="#0B0D10" stroke="#FFD43B" stroke-width="2"/>
    <circle cx="415" cy="235" r="4" fill="#FFD43B"/>
    <text x="415" y="165" text-anchor="middle" class="mono gold label">03</text>
    <text x="415" y="185" text-anchor="middle" class="title" font-size="12">REAL-TIME</text>
    <text x="415" y="202" text-anchor="middle" class="mono sub muted">FIREBASE • SYNC</text>
  </g>

  <!-- milestone 04 -->
  <g>
    <circle cx="585" cy="235" r="12" fill="#0B0D10" stroke="#E63946" stroke-width="2"/>
    <circle cx="585" cy="235" r="4" fill="#E63946"/>
    <text x="585" y="285" text-anchor="middle" class="mono red label">04</text>
    <text x="585" y="305" text-anchor="middle" class="title" font-size="12">BACKEND</text>
    <text x="585" y="322" text-anchor="middle" class="mono sub muted">NODE • EXPRESS • MONGO</text>
  </g>

  <!-- milestone 05 -->
  <g>
    <circle cx="755" cy="235" r="12" fill="#0B0D10" stroke="#FFD43B" stroke-width="2"/>
    <circle cx="755" cy="235" r="4" fill="#FFD43B"/>
    <text x="755" y="165" text-anchor="middle" class="mono gold label">05</text>
    <text x="755" y="185" text-anchor="middle" class="title" font-size="12">AI + AUTOMATION</text>
    <text x="755" y="202" text-anchor="middle" class="mono sub muted">AI • N8N • WORKFLOWS</text>
  </g>

  <!-- milestone 06 -->
  <g>
    <circle cx="925" cy="235" r="12" fill="#0B0D10" stroke="#E63946" stroke-width="2"/>
    <circle cx="925" cy="235" r="4" fill="#E63946"/>
    <text x="925" y="285" text-anchor="middle" class="mono red label">06</text>
    <text x="925" y="305" text-anchor="middle" class="title" font-size="12">SYSTEMS</text>
    <text x="925" y="322" text-anchor="middle" class="mono sub muted">JAVA • SPRING BOOT</text>
  </g>

  <!-- future direction -->
  <g>
    <rect x="285" y="350" width="430" height="40" rx="10" fill="#0B0D10" stroke="url(#future)"/>
    <text x="500" y="366" text-anchor="middle" class="mono small gold">NEXT EVOLUTION</text>
    <text x="500" y="382" text-anchor="middle" class="title" font-size="13">
      SPRING BOOT → SYSTEM DESIGN → SCALABLE ARCHITECTURE
    </text>
  </g>

  <!-- footer -->
  <line x1="55" y1="399" x2="945" y2="399" stroke="#303842"/>
  <text x="55" y="404" class="mono" font-size="8" fill="#8A949E">CURIOUS → BUILDING → UNDERSTANDING → EVOLVING</text>
  <text x="945" y="404" text-anchor="end" class="mono" font-size="8" fill="#E63946">HNF // 002</text>
</svg>